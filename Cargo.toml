[package]
name = "baraddur"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Project-agnostic file watcher that surfaces issues before CI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/curtisault/baraddur"
homepage = "https://github.com/curtisault/baraddur"
documentation = "https://docs.rs/baraddur"
readme = "README.md"
keywords = ["file-watcher", "cli", "watch", "developer-tools", "ci"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/", "barad-dur.svg", "CLAUDE.md", "AGENTS.md", ".github/"]

[[bin]]
name = "baraddur"
path = "src/main.rs"

[lib]
name = "baraddur"
path = "src/lib.rs"

[dependencies]
notify-debouncer-mini = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
shell-words = "1"
dirs = "6"
anyhow = "1"
crossterm = { version = "0.29", features = ["events"] }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
