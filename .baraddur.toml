[watch]
extensions = ["rs", "toml"]
debounce_ms = 500
ignore = ["target", ".git", ".baraddur", ".claude"]

[output]
clear_screen = true
show_passing = false

# Named subsets selectable via `--profile <name>`. Composes with --staged /
# --since / if_changed (profile narrows first, path filtering after).
[profiles]
quick = ["fmt", "clippy"]
full  = ["fmt", "clippy", "test"]

[[steps]]
name = "fmt"
cmd = "cargo fmt --check"
parallel = false

[[steps]]
name = "clippy"
cmd = "cargo clippy --all-targets -- -D warnings"
parallel = true

[[steps]]
name = "test"
cmd = "cargo test"
parallel = true

# Demo: exercises if_changed + {files}. Save a .toml file (Cargo.toml,
# .baraddur.toml) to see it run and echo the changed paths; save a .rs file
# and it disappears from the step list entirely. Delete this block when done.
#
# Note: don't wrap {files} in `sh -c '...'` — the shell-quoted substitution
# collides with the outer single quotes. Use bare commands instead.
[[steps]]
name = "toml-changed"
cmd = "echo Changed TOML: {files}"
parallel = true
if_changed = ["**/*.toml"]

# Demo: exercises the [on_failure] hook. To trigger, break a step (e.g. add
# `let _x: u32 = "string";` to any .rs file → clippy fails). You should see:
# 1. A dim "running on_failure hook…" line below the failure summary
# 2. ~1 second later, the captured stdout (first 20 lines of combined failure
#    output) replaces it. Delete this block when done.
[on_failure]
enabled = true
cmd = "sh -c 'sleep 1; head -20'"
prompt = "HØØK: First 20 lines of failure output:"
timeout_secs = 10
